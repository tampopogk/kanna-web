# Ghostty settings for the capture app's terminals (start.sh copies this to
# $STATE/xdg/ghostty/config). Light colours, after GitHub's light theme, so the
# terminal matches Kanna's light window. Kanna reads colours, cursor and font
# from here as Ghostty does.
background = #fcfcfc
foreground = #1f2328
cursor-color = #1f2328
selection-background = #ddf4ff
selection-foreground = #1f2328
palette = 0=#24292f
palette = 1=#cf222e
palette = 2=#116329
palette = 3=#7d4e00
palette = 4=#0969da
palette = 5=#8250df
palette = 6=#1b7c83
palette = 7=#6e7781
palette = 8=#57606a
palette = 9=#a40e26
palette = 10=#1a7f37
palette = 11=#633c01
palette = 12=#218bff
palette = 13=#a475f9
palette = 14=#3192aa
palette = 15=#8c959f
cursor-style-blink = false
