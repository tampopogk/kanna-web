# Ghostty settings for the capture app's terminals in dark mode (start.sh copies
# this to $STATE/xdg/ghostty/config). Dark colours, after GitHub's dark dimmed
# theme, close to Kanna's dark window so the terminal sits in it. Kanna reads
# colours, cursor and font from here as Ghostty does.
background = #1e1e1e
foreground = #d1d7e0
cursor-color = #d1d7e0
selection-background = #264466
selection-foreground = #d1d7e0
palette = 0=#545d68
palette = 1=#f47067
palette = 2=#57ab5a
palette = 3=#c69026
palette = 4=#539bf5
palette = 5=#b083f0
palette = 6=#39c5cf
palette = 7=#909dab
palette = 8=#636e7b
palette = 9=#ff938a
palette = 10=#6bc46d
palette = 11=#daaa3f
palette = 12=#6cb6ff
palette = 13=#dcbdfb
palette = 14=#56d4dd
palette = 15=#cdd9e5
cursor-style-blink = false
